owner: "superuser404notfound"
overview: "Derive intro, recap and outro segments from chapter positions, calibrated per series."
description: >
  Many rips carry chapter markers that already encode the structure of an episode:
  the last chapter often starts exactly where the end credits begin, and an early
  chapter marks the end of the "previously on" recap. Chapter Rules learns, per
  series, which chapter position corresponds to which segment type by comparing
  candidate rules against segments that are already known to be correct, and only
  applies a rule when it agrees often enough. It fills gaps left by audio and
  black-frame detection without touching segments that are already good.

