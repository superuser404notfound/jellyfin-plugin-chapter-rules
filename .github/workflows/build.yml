name: Build Plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.ChapterRules/Jellyfin.Plugin.ChapterRules.csproj

      - name: Build
        run: >
          dotnet build Jellyfin.Plugin.ChapterRules/Jellyfin.Plugin.ChapterRules.csproj
          -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test Jellyfin.Plugin.ChapterRules.Tests/Jellyfin.Plugin.ChapterRules.Tests.csproj -c Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.ChapterRules
          path: Jellyfin.Plugin.ChapterRules/bin/Release/net9.0/Jellyfin.Plugin.ChapterRules.dll
